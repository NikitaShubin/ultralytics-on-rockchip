# Имя проекта фиксировано: образ сервиса = percept-percept:latest (от него
# наследуется convert/Dockerfile), независимо от имени каталога репозитория.
name: percept

services:
  percept:
    container_name: percept
    build: .
    network_mode: host
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
    privileged: true
    volumes:
      - /dev:/dev
      - /sys/class/video4linux:/sys/class/video4linux:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /usr/lib/librknn_api.so:/usr/lib/librknn_api.so
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so
      - /proc/device-tree/compatible:/proc/device-tree/compatible:ro
      - ./model:/app/model:ro
      # ReID-веса докачиваются кодом (reid.py) по требованию — не в гите.
      - ./model/reid:/app/model/reid
      - ./test:/app/test:rw
      - ./percept:/app/percept:ro
      - ./main.py:/app/main.py
      - ./app.py:/app/app.py
      - ./pipeline.py:/app/pipeline.py
      - ./detector_frame.py:/app/detector_frame.py
      - ./config.py:/app/config.py
      - ./camera_source.py:/app/camera_source.py
      - ./video_loop.py:/app/video_loop.py
      - ./tracker.py:/app/tracker.py
      - ./reid.py:/app/reid.py
      - ./websocket_server.py:/app/websocket_server.py
      - ./templates:/app/templates:ro
      - ./benchmark:/app/benchmark:rw
      - ./datasets:/app/datasets:ro
      # Временная замена камеры: каталог с видеофайлами (см. CAM_MODE/CAM_SOURCE)
      - ./video:/app/video:ro
    environment:
      - BACKEND=${BACKEND:-npu}
      - MODEL=${MODEL:-}
      - WEB_MODE=${WEB_MODE:-2}
      - CAM_MODE=${CAM_MODE:-auto}
      # Замена камеры видеофайлом (медленная отладка): CAM_MODE=file
      # + CAM_SOURCE=/app/video/<файл> (зацикливается). Откат: CAM_MODE=auto.
      - CAM_SOURCE=${CAM_SOURCE:-}
      - CAM_W=${CAM_W:-0}
      - CAM_H=${CAM_H:-0}
      # Разрешение захвата: model — рабочее разрешение модели (input_size),
      # source — максимальное разрешение камеры; 0 = авто (не задано явно)
      - CAM_RESOLUTION=${CAM_RESOLUTION:-model}
      - TEST_MODE=${TEST_MODE:-1}
      - JPEG_QUALITY=${JPEG_QUALITY:-85}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MASK_FORMAT=${MASK_FORMAT:-contour}
      # Трекинг: по умолчанию выключен (деплой работает как раньше).
      # TRACKER=on включает; TRACKER_CMC=sof|off — компенсация движения камеры;
      # TRACKER_REID (Фаза 2) — нейро-ReID osnet: off | on (веса докачаются в model/reid).
      - TRACKER=${TRACKER:-off}
      - TRACKER_CMC=${TRACKER_CMC:-sof}
      - TRACKER_REID=${TRACKER_REID:-off}
    restart: unless-stopped
