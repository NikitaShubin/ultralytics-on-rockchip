[project]
name = 'webcam'
version = '0.2.0'

[tool.ruff]
line-length = 88
target-version = 'py311'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'COM812',
    'D100', 'D101', 'D102', 'D103', 'D107',
    'D203',
    'D213',
    'D401',
    'Q000',
    'Q003',
    'RUF001', 'RUF002', 'RUF003',
    'RUF100',
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']
'tests/**' = ['S101', 'PLR2004']
'config.py' = ['S104']
'websocket_server.py' = ['S104']

[tool.ruff.format]
quote-style = 'single'

[tool.flake8]
max-line-length = 88
select = 'WPS'
ignore = 'ALL'
format = 'wemake'
show-source = true
statistics = true

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = ['-v', '--strict-markers', '--strict-config']
pythonpath = ['.']
markers = [
    'slow: marks tests as slow (deselect with -m "not slow")',
    'integration: marks tests as integration tests',
]
filterwarnings = ['error']

[tool.mypy]
python_version = '3.10'
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = 'skip'

