services:
  converter:
    build: .
    image: percept-converter:latest
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ../model:/app/converter/model
      - ./weights:/app/converter/weights
      - .:/app/converter
      - ../datasets/coco_val2017:/app/coco_val2017:ro
      - ../datasets/dotav1:/app/dotav1:ro
      - ../datasets/cityscapes:/app/cityscapes:ro
