services:
  convert:
    build: .
    image: percept-converter:latest
    network_mode: host
    privileged: true
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
    volumes:
      - /proc/device-tree/compatible:/proc/device-tree/compatible:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - /usr/lib/librknn_api.so:/usr/lib/librknn_api.so:ro
      - ../model:/app/convert/model
      - ../cache:/app/cache
      - ./weights:/app/convert/weights
      - .:/app/convert
      - ../datasets:/app/datasets
      - ../setup_datasets.py:/app/convert/setup_datasets.py:ro
      - ../pipeline.py:/app/pipeline.py:ro
      - ../percept:/app/percept:ro
      - ../benchmark:/app/benchmark:ro
